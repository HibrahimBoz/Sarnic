[stt]
gpu_model = "large-v3"
cpu_model = "medium"
beam_size = 5
vad = true
vad_max_konusma_sn = 20.0
vad_bosluk_ms = 500
vad_konusma_pad_ms = 400
halusinasyon_esik_sn = 2.0
guven_esik = 0.45
guven_kisa_esik = 0.30
terimler_dosyasi = "terimler.txt"
baglam_tasi = true
ikinci_gecis = true
ikinci_gecis_esik = 0.60
ikinci_gecis_en_cok_oran = 0.25
parca_siniri_tekrar_temizle = true
kisa_altyazi_uzat = true
bosluk_doldur = true
bosluk_min_sn = 30
bosluk_aktif_orani = 0.40
bosluk_enerji_db = 3
bosluk_en_cok_oran = 1.0
[ses]
highpass_hz = 80
afftdn_nf = -25
lufs = -16.0
tp = -1.5
lra = 11
agir_kuru_oran = 0.2
[goruntu]
etkin = false
crf = 20
nvenc = true
# upscale_model: "hizli" (realesr-animevideov3), "agir" (realesrgan-x4plus), "genel" (realesr-general-x4v3)
upscale_model = "hizli"
hedef_yukseklik = 1080
parca_sn = 120
ara_format = "jpg"
[izle]
yoklama_sn = 5
sabit_tur = 3
[genel]
ara_dosya_sakla = false
cpu_threads = 0

[dizin]
kokler = []                 # Boşsa --kok gerekli; birden fazla kök verilebilir.
depo = ""                   # Boşsa ilk kökün altında _bulgu.
haric = ["_bulgu", "$RECYCLE.BIN", "System Volume Information", "_ara", ".git", "node_modules"]
calisma_db = ""             # YEREL yazar VT; boşsa paket/is/dizin/dizin.db.
yayin_dk = 30               # Değişiklik varsa en geç bu aralıkta yayın.
tarama_dk = 15              # İzleme kipinde taramalar arası dakika.
max_dosya_mb = 2048         # Daha büyük dosyaların yalnız adı dizinlenir.
isci = 0                    # 0: çekirdek/2; 1: aynı süreçte OCR.
sakla_yayin = 3             # Saklanacak anlık görüntü sayısı.

[ocr]
profil = "uyarlamali"       # hizli | uyarlamali | kalite
dpi = 300                   # PDF OCR görüntüsünün çözünürlüğü.
min_metin = 40              # Daha az gömülü karakter içeren sayfaya OCR.
ikinci_esik = 0.80          # Düşük güvenli satırlarda ikinci görüş.
cihaz = "auto"              # auto | cpu | cuda (ONNX CUDA sağlayıcısı gerekli).
sayfa_zaman_asimi_sn = 180   # Takılan işçi sonlandırılır; tek işçide sınır yok.
gomulu_gorsel = true        # DOCX/PPTX içinde en az 200x200 görsellere OCR.
tesseract = true            # Paket içindeki araç varsa tur+eng ikinci görüş.
sozluk = 'sozluk\tr_kelime.txt' # Yoksa yalnız terimler.txt kullanılır.
